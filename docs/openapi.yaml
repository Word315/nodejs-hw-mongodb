openapi: 3.1.0
info:
  version: 1.0.0
  title: Contacts API
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
  description: API для роботи з контактами (HW7)
tags:
  - name: Contacts
    description: Операції з контактами
  - name: Auth
    description: Реєстрація та логін
servers:
  - url: http://localhost:3000
  - url: https://nodejs-hw-mongodb-7-u6lx.onrender.com
paths:
  /contacts:
    get:
      $ref: '../swagger/paths/contacts/get.yaml'
    post:
      $ref: '../swagger/paths/contacts/post.yaml'
  /contacts/{id}:
    get:
      $ref: '../swagger/paths/contacts/{id}/get.yaml'
    patch:
      $ref: '../swagger/paths/contacts/{id}/patch.yaml'
    delete:
      $ref: '../swagger/paths/contacts/{id}/delete.yaml'
    put:
      $ref: '../swagger/paths/contacts/{id}/put.yaml'
  /auth/register:
    $ref: '../swagger/paths/auth/post.yaml'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
